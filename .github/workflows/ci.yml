name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: python -m pip install --upgrade pip -r requirements-ci.txt

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Verify published S9 artifact integrity
        run: python src/s9_verify_results.py

      - name: Verify published S10 artifact integrity
        run: python src/s10_verify_results.py

      - name: Check shell syntax
        run: |
          for script in src/run_*.sh; do
            bash -n "$script"
          done
